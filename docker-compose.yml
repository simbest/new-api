# New-API Docker Compose Configuration
#
# Equivalent to:
# docker run -d --name new-api-8800 --restart always -p 8800:3000 \
#   -v /data/libs/new-api/data:/data \
#   -v /data/libs/new-api/logs:/app/logs \
#   -e SQL_DSN='...' \
#   -e REDIS_CONN_STRING='...' \
#   -e TZ=Asia/Shanghai \
#   -e ERROR_LOG_ENABLED=true \
#   -e BATCH_UPDATE_ENABLED=true \
#   calciumion/new-api:latest --log-dir /app/logs

version: '3.4'

services:
  new-api:
    image: calciumion/new-api:latest
    container_name: new-api-8800
    restart: always
    command: --log-dir /app/logs
    ports:
      - "8800:3000"
    volumes:
      - /data/libs/new-api/data:/data
      - /data/libs/new-api/logs:/app/logs
    environment:
      - SQL_DSN=${SQL_DSN:?SQL_DSN is required}
      - REDIS_CONN_STRING=${REDIS_CONN_STRING:?REDIS_CONN_STRING is required}
      - TZ=Asia/Shanghai
      - ERROR_LOG_ENABLED=true
      - BATCH_UPDATE_ENABLED=true
